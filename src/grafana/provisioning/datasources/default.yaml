apiVersion: 1

datasources:
  - name: Prometheus
    uid: webstore-metrics
    type: prometheus
    url: http://prometheus:9090
    editable: true
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - datasourceUid: webstore-traces
          name: trace_id
        - url: http://localhost:16686/jaeger/ui/trace/$${__value.raw}
          name: trace_id
          urlDisplayLabel: View in Jaeger UI

  - name: OpenSearch
    uid: dotnetatlas-opensearch
    type: grafana-opensearch-datasource
    url: http://fusionauthsearch:9200
    editable: true
    jsonData:
      database: "logs-*"
      flavor: opensearch
      version: "2.11.0"
      timeField: "@timestamp"
      logMessageField: message
      logLevelField: level
      maxConcurrentShardRequests: 5
      pplEnabled: true
