apiVersion: 1

datasources:
  - name: OpenSearch
    uid: webstore-logs
    type: grafana-opensearch-datasource
    url: http://fusionauthsearch:9200/
    access: proxy
    editable: true
    isDefault: false
    jsonData:
      database: dotnetatlas-logs-*
      flavor: opensearch
      logLevelField: level.keyword
      logMessageField: message
      pplEnabled: true
      timeField: "@timestamp"
      version: 3.2.0
