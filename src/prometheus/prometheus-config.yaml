global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'otel-collector'
    scrape_interval: 5s
    static_configs:
      - targets: ['otel-collector:8889']  # OTLP Prometheus exporter endpoint

  - job_name: 'bc-healthchecks'
    # Every scrape re-runs the whole `ready` set from scratch — health-check results are never
    # cached, and the Kafka probe produces a real message per run. This job is not the only caller:
    # docker-compose probes /api/readiness on the same containers every 15s, so at 10s here each
    # container ran the set ~10x/min and now runs it ~6x/min, with compose the larger share.
    # health_checks-dashboard.json reads these gauges raw with no rate() windows, so the coarser
    # resolution costs only flap-detection latency.
    # scrape_timeout stays explicit: the global default at the top of this file is far tighter
    # than this set's worst case — the largest per-check `timeout:` across the scraped services
    # — so inheriting it would time out healthy scrapes.
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /api/health/prometheus
    static_configs:
      - targets: ['basket.api:8080']
        labels:
          app: basket
          kind: healthchecks
      - targets: ['catalog.api:8080']
        labels:
          app: catalog
          kind: healthchecks
      - targets: ['inventory.api:8080']
        labels:
          app: inventory
          kind: healthchecks
      - targets: ['invoicing.api:8080']
        labels:
          app: invoicing
          kind: healthchecks
      - targets: ['notifications.api:8080']
        labels:
          app: notifications
          kind: healthchecks
      - targets: ['ordering.api:8080']
        labels:
          app: ordering
          kind: healthchecks
      - targets: ['payments.api:8080']
        labels:
          app: payments
          kind: healthchecks
      - targets: ['bff.api:8080']
        labels:
          app: bff
          kind: healthchecks
      # The saga is not a bounded context, but it belongs in THIS job rather than its own:
      # health_checks-dashboard.json hardcodes job="bc-healthchecks" in every panel query, so a
      # separate job would scrape fine and still render nothing. Its checks also join that
      # dashboard's count() aggregates, so those totals now span the saga too.
      - targets: ['saga:8080']
        labels:
          app: saga
          kind: healthchecks

  - job_name: 'outbox-relay-healthchecks'
    # Interval/timeout reasoning: see bc-healthchecks above.
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /api/health/prometheus
    static_configs:
      - targets: ['outbox-relay-saga:8080']
        labels:
          app: outbox-relay-saga
          kind: healthchecks
      - targets: ['outbox-relay-basket:8080']
        labels:
          app: outbox-relay-basket
          kind: healthchecks
      - targets: ['outbox-relay-catalog:8080']
        labels:
          app: outbox-relay-catalog
          kind: healthchecks
      - targets: ['outbox-relay-inventory:8080']
        labels:
          app: outbox-relay-inventory
          kind: healthchecks
      - targets: ['outbox-relay-invoicing:8080']
        labels:
          app: outbox-relay-invoicing
          kind: healthchecks
      - targets: ['outbox-relay-notifications:8080']
        labels:
          app: outbox-relay-notifications
          kind: healthchecks
      - targets: ['outbox-relay-ordering:8080']
        labels:
          app: outbox-relay-ordering
          kind: healthchecks
      - targets: ['outbox-relay-payments:8080']
        labels:
          app: outbox-relay-payments
          kind: healthchecks

otlp:
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment.name

storage:
  tsdb:
    out_of_order_time_window: 30m
