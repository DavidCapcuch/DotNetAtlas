#
# nginx-cdn reverse-proxy config for the DotNetAtlas eShop reference solution.
#
# Role: local analog of Azure Front Door / Azure CDN. Fronts the Azurite blob
# emulator and caches successful GETs to demonstrate CDN-like edge-cache semantics.
# Production deployments swap this container for Azure Front Door (or Azure CDN)
# pointed at a real Azure Blob Storage account; the `Cache-Control` semantics stay
# identical. See ADR-0017 for the full decision context.
#
# Proxy-cache sizing (ADR-0017 literal): 1 GB max, 1 h inactive, 10 MB keys zone.
# Cache key is the full URL, so SAS-signed URLs with unique query strings cannot
# cross-contaminate between users.
#

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Basic access log — helpful for local cache-hit inspection.
    log_format  cdn '$remote_addr - [$time_local] "$request" '
                   '$status $body_bytes_sent upstream=$upstream_addr '
                   'cache_status=$upstream_cache_status';
    access_log  /var/log/nginx/access.log cdn;

    proxy_cache_path /var/cache/nginx
                     levels=1:2
                     keys_zone=blob_cache:10m
                     max_size=1g
                     inactive=1h
                     use_temp_path=off;

    server {
        listen 8080;
        server_name _;

        # Health probe (200 from nginx itself; does not depend on upstream).
        location = /nginx-healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://azurite:10000;
            proxy_cache blob_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout invalid_header updating
                                   http_500 http_502 http_503 http_504;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_ignore_headers X-Accel-Expires;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
