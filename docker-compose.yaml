  # Backend-for-Frontend aggregation gateway (bff.md). Stateless: no database, no outbox.
  # Serves the public product-page (#327) and home-page (#328) by composing Catalog + Inventory
  # behind the redis-cache FusionCache, and runs a consume-only Kafka cache invalidator
  # (group bff-group, no producer/inbox/DLT — bff.md § 2.2) over the existing BC topics.
  bff.api:
    build:
      context: .
      dockerfile: src/EShop.BFF/EShop.BFF.Api/Dockerfile
      args:
        # Alpine base so the compose-level wget HEALTHCHECK has a shell (same as the BCs).
        BASE_IMAGE: *bc-base-image
    healthcheck: *readiness-healthcheck
    container_name: bff.api
    restart: unless-stopped
    profiles:
      - full
    depends_on:
      # redis-cache is the only readiness-gating dependency (ADR-0016): the BFF degrades
      # gracefully without it. keycloak is needed for the outbound service token.
      redis-cache:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # Kafka + Schema Registry must be up so the bff-group cache-invalidation bus can start at
      # boot; kafka-create-topic must have created the three subscribed topics first (the BFF
      # only consumes them — it creates no topics).
      kafka:
        condition: service_healthy
      kafka-create-topic:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      # Upstreams are start-ordering only (NOT health-gated): the BFF is built to boot and
      # degrade when an upstream is down (resilience + fail-safe, bff.md § 2.1 / § 3.1), so it
      # must not refuse to start just because Catalog or Inventory is unhealthy.
      catalog.api:
        condition: service_started
      inventory.api:
        condition: service_started
    # Same iss/metadata bridge as the BCs: map host `localhost` to the gateway so the
    # ServiceAuth token endpoint (http://localhost:9011/realms/dotnetatlas, from appsettings)
