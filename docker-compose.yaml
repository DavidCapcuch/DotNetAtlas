# Shared healthcheck for BC API services. Probes the /api/readiness endpoint via
# busybox wget (built into mcr.microsoft.com/dotnet/aspnet:10.0.0-alpine, which
# each *.api service pins via build.args.BASE_IMAGE). Readiness exercises the
# downstream dependencies (DB / Redis / Kafka / Schema Registry) registered with
# the `ready` tag in Platform.ServiceDefaults, giving (healthy) a real signal.
x-readiness-healthcheck: &readiness-healthcheck
  # Use 127.0.0.1 (IP literal) not localhost: catalog/ordering/invoicing.api each
  # have `extra_hosts: "localhost:host-gateway"` (for the Keycloak issuer bridge),
  # which overrides /etc/hosts so `localhost` resolves to the host-gateway IP and
  # the probe never hits in-container loopback. IP literals bypass /etc/hosts.
  test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/readiness"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 45s

services:
  postgresdb:
    image: postgres:18.3@sha256:52e6ffd11fddd081ae63880b635b2a61c14008c17fc98cdc7ce5472265516dd0
    container_name: postgres5433
    shm_size: 256mb
    restart: always
    profiles:
      - core
      - full
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./src/keycloak/init-db.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
      - ./src/postgres/init-bcs.sql:/docker-entrypoint-initdb.d/15-bcs.sql:ro
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Redis split per ADR-0016:
  #   - redis-basket : authoritative store (Basket aggregate). AOF everysec + noeviction.
  #                    Loss = customer incident; failure mode surfaces as OOM errors, not silent evictions.
  #   - redis-cache  : volatile (BFF L2 FusionCache backplane + ephemeral cache for other services).
  #                    No persistence; 512 MB allkeys-lru eviction; loss = next request pays miss.
  redis-basket:
    image: redis:7.4.6@sha256:d7432711a2a5c99c2e9dd0e006061cd274d7cb7a9e77f07ffe2ea99e21244677
    container_name: redis-basket
    restart: always
    profiles:
      - core
      - full
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction" ]
    volumes:
      - redis-basket-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  redis-cache:
    image: redis:7.4.6@sha256:d7432711a2a5c99c2e9dd0e006061cd274d7cb7a9e77f07ffe2ea99e21244677
    container_name: redis-cache
    restart: always
    profiles:
      - full
    ports:
      - "6380:6379"
    command: [ "redis-server", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru" ]
    # No volume — volatile by design (cache should be empty on restart).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  redis-insight:
    image: redis/redisinsight:2.70@sha256:b7aa18e73329ebb2e3d9e949b8d35193bf5415ef35c16fd9a50e6f832922b296
    restart: always
    profiles:
      - full
    ports:
      - "5540:5540"
    environment:
      - REDISINSIGHT_SKIP_EULA=true
    volumes:
      - redis-insight:/data
    depends_on:
      - redis-basket
    # Auto-connect to redis-basket (authoritative store — the interesting data lives here).
    # Add redis-cache manually via the UI if cache-state inspection is needed.
    command: [ "redis-insight", "--auto-connect", "redis://redis-basket:6379" ]
    deploy:
      resources:
        limits:
          memory: 256M

  seq:
    image: datalust/seq:2025.2@sha256:080ccf44e0593cd4698ba1404b90b4f8bf51ff342e45242f611c91e329554f50
    container_name: seq5341
    profiles:
      - full
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    volumes:
      - seq_data:/data
    deploy:
      resources:
        limits:
          memory: 512M

  jaeger:
    image: jaegertracing/all-in-one:1.74.0@sha256:c87fc1d9b22766284168abb2ac57ac2160dfc26484e4f965ff2dcc6b849b263a
    container_name: jaeger16686ui4317grpc
    profiles:
      - full
    command:
      - "--memory.max-traces=25000"
      - "--query.base-path=/jaeger/ui"
      - "--prometheus.server-url=http://prometheus:9090"
      - "--prometheus.query.normalize-calls=true"
      - "--prometheus.query.normalize-duration=true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317"
    environment:
      - METRICS_STORAGE_TYPE=prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
  
  prometheus:
    image: quay.io/prometheus/prometheus:v3.6.0@sha256:76947e7ef22f8a698fc638f706685909be425dbe09bd7a2cd7aca849f79b5f64
    container_name: prometheus9090
    profiles:
      - full
    command:
      - --web.console.templates=/etc/prometheus/consoles
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --storage.tsdb.retention.time=3h
      - --config.file=/etc/prometheus/prometheus-config.yaml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.route-prefix=/
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=otlp-write-receiver
    volumes:
      - ./src/prometheus/prometheus-config.yaml:/etc/prometheus/prometheus-config.yaml
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    container_name: grafana3000
    profiles:
      - full
    deploy:
      resources:
        limits:
          memory: 120M
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=http://my.grafana.server/
      - GF_PLUGINS_PREINSTALL=grafana-opensearch-datasource
    volumes:
      - ./src/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./src/grafana/provisioning/:/etc/grafana/provisioning/
    ports:
      - "3000:3000"

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.137.0@sha256:886722fe0f37af9d1fe24d29529253ec59fbf263b3b1df4facaf221373e19d23
    container_name: otel-collector
    profiles:
      - full
    deploy:
      resources:
        limits:
          memory: 200M
    restart: unless-stopped
    command: [ "--config=/etc/otelcol-config.yml" ]
    user: 0:0
    volumes:
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./src/otel-collector/otelcol-config.yml:/etc/otelcol-config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      jaeger:
        condition: service_started
    environment:
      - ENVOY_PORT
      - HOST_FILESYSTEM
      - OTEL_COLLECTOR_HOST
      - OTEL_COLLECTOR_PORT_GRPC
      - OTEL_COLLECTOR_PORT_HTTP
      - GOMEMLIMIT=160MiB
  
  kafka:
    image: confluentinc/cp-kafka:7.5.9
    container_name: broker
    restart: unless-stopped
    profiles:
      - full
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      CLUSTER_ID: "EmptNWtoR4GGWx-BH6nGLQ"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_metadata:/var/lib/kafka/metadata
    healthcheck:
      test: [ "CMD", "kafka-topics", "--list", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M

  # Topic taxonomy (full reference: docs/kafka-topology.md):
  #   * Event-log    — retention.ms=-1 (infinite). Downstream BCs replay-rebuild
  #                    from these (catalog.*, ordering.orders, inventory.*-events,
  #                    inventory.reservations, payments.transactions). BACKWARD
  #                    compat per ADR-0007.
  #   * Saga state   — retention.ms=2592000000 (30d). Run-history of in-flight
  #                    sagas (basket.sessions, checkout.sagas). 30d forensic
  #                    window per ADR-0004.
  #   * Command      — retention.ms=604800000 (7d). Transient intent
  #                    (*.*-commands). Unconsumed-after-7d is a runbook event,
  #                    not a replay candidate.
  #   * Audit        — retention.ms=315360000000 (10y). Regulatory retention
  #                    (invoicing.invoices).
  #   * Health probe — defaults, partitions=1 (healthchecks).
  # Topics WITHOUT explicit retention.ms (weather.*, payments.commands) fall
  # back to the Kafka broker default (~7d) and are treated as command-class.
  # Replication factor is 1 because this is a single-broker dev compose;
  # production raises to 3 with min.insync.replicas=2.
  kafka-create-topic:
    container_name: kafka-create-topic
    image: confluentinc/cp-kafka:7.5.9
    profiles:
      - full
    command: >
      bash -c "
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic weather.forecast.requests --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic weather.feedbacks --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic weather.alerts --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic payments.commands --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic payments.transactions --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic healthchecks --partitions 1 --replication-factor 1 --config min.insync.replicas=1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic catalog.products --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=-1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic catalog.categories --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=-1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic basket.sessions --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=2592000000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic ordering.orders --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=-1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic ordering.order-commands --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=604800000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic inventory.stock-events --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=-1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic inventory.reservations --partitions 6 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=-1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic inventory.reservation-commands --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=604800000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic checkout.sagas --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=2592000000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic invoicing.invoices --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=315360000000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic notifications.email-commands --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=604800000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic notifications.email-events --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=-1 --if-not-exists
      "
    depends_on:
      kafka:
        condition: service_healthy

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    restart: unless-stopped
    profiles:
      - full
    healthcheck:
      test: curl --output /dev/null --silent --head --fail http://schema-registry:8081/subjects
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    deploy:
      resources:
        limits:
          memory: 512M

  # One-shot bootstrap that PUTs Schema Registry compatibility modes per ADR-0007.
  # Global default: FORWARD_TRANSITIVE (conservative for any future subject).
  # Per-subject overrides use Record Name Strategy (Namespace.RecordName); subjects
  # not yet published produce a 40401 from the Registry which we tolerate so the
  # init container can run before any producer warmup.
  schema-registry-init:
    container_name: schema-registry-init
    image: curlimages/curl:8.10.1
    profiles:
      - full
    depends_on:
      schema-registry:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -eu
      - -c
      - |
        SR=http://schema-registry:8081
        CT='Content-Type: application/vnd.schemaregistry.v1+json'
        # Global fallback
        curl -fsS -X PUT "$$SR/config" -H "$$CT" -d '{"compatibility":"FORWARD_TRANSITIVE"}'
        # Event-log topics → FORWARD_TRANSITIVE
        EVENT_SUBJECTS="Catalog.Products.ProductCreatedEvent Catalog.Products.ProductPriceChangedEvent Catalog.Products.ProductDescribedEvent Catalog.Products.ProductActivatedEvent Catalog.Products.ProductDiscontinuedEvent Catalog.Products.ProductReactivatedEvent Catalog.Categories.CategoryCreatedEvent Catalog.Categories.CategoryReparentedEvent Basket.Sessions.BasketCheckoutInitiatedEvent Ordering.Orders.OrderCreatedEvent Ordering.Orders.OrderConfirmedEvent Ordering.Orders.OrderShippedEvent Ordering.Orders.OrderDeliveredEvent Ordering.Orders.OrderCancelledEvent Ordering.Orders.OrderFailedEvent Inventory.StockItems.StockReceivedEvent Inventory.StockItems.StockAdjustedEvent Inventory.StockItems.ReservationConfirmedEvent Inventory.StockItems.ReservationReleasedEvent Payments.Transactions.PaymentAuthorizedEvent Payments.Transactions.PaymentCapturedEvent Payments.Transactions.PaymentFailedEvent Payments.Transactions.PaymentRefundedEvent Invoicing.Invoices.InvoiceIssuedEvent Invoicing.Invoices.InvoiceDeliveredEvent"
        # Command topics → FULL_TRANSITIVE
        COMMAND_SUBJECTS="Ordering.Orders.OrderCommand Inventory.StockItems.ReservationCommand Payments.Transactions.PaymentCommand"
        for s in $$EVENT_SUBJECTS; do
          curl -fsS -X PUT "$$SR/config/$$s" -H "$$CT" -d '{"compatibility":"FORWARD_TRANSITIVE"}' || echo "warn: $$s not yet registered"
        done
        for s in $$COMMAND_SUBJECTS; do
          curl -fsS -X PUT "$$SR/config/$$s" -H "$$CT" -d '{"compatibility":"FULL_TRANSITIVE"}' || echo "warn: $$s not yet registered"
        done
        echo "compat bootstrap complete"

  akhq:
    container_name: akhq
    image: tchiotludo/akhq:0.26.0
    profiles:
      - full
    depends_on:
      - kafka
    ports:
      - "9000:8080"
    restart: always
    environment:
      AKHQ_CONFIGURATION: >
        akhq:
          server:
            servlet:
              context-path: /
          security:
            default-group: admin
            enabled: false
          connections:
            local:
              properties:
                bootstrap.servers: "kafka:9092"
              schema-registry:
                url: "http://schema-registry:8081"
    deploy:
      resources:
        limits:
          memory: 512M

  # BC-scoped outbox relays — one per BC schema + one for the checkout saga.
  #   - outbox-relay-weather : drains Weather (existing reference service).
  #   - outbox-relay-{catalog,basket,ordering,inventory,payments,invoicing} : Wave 1 BCs.
  #     NOTE: Wave 0 lands these containers but the target databases do NOT exist yet.
  #     Expect Npgsql connection crash-loops until the Wave 1 BC lands its schema/migration.
  #     `restart: unless-stopped` recovers automatically once the DB appears.
  #   - outbox-relay-saga    : drains checkout saga's MassTransit outbox (unchanged).
  outbox-relay-weather:
    build:
      context: .
      dockerfile: platform/Platform.OutboxRelay.WorkerService/Dockerfile
    container_name: outbox-relay-weather
    restart: unless-stopped
    profiles:
      - full
    depends_on:
      postgresdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      - ConnectionStrings__Outbox=Host=postgresdb;Port=5432;Database=Weather;Username=postgres;Password=${POSTGRES_PASSWORD}
      - KafkaProducer__BootstrapServers=broker:9092
      - KafkaProducer__ClientId=outbox-relay-weather-worker
      - KafkaProducer__LingerMs=5
      - OutboxRelay__SchemaName=weather
      - OutboxRelay__TableName=OutboxMessages
      - OutboxRelay__PollingIntervalMs=2000
      # - ASPNETCORE_ENVIRONMENT=Local
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=WeatherOutboxRelay
    ports:
      - "8088:8080"  # Health checks endpoint
    deploy:
      resources:
        limits:
          memory: 512M

  outbox-relay-basket:
    build:
      context: .
      dockerfile: platform/Platform.OutboxRelay.WorkerService/Dockerfile
    container_name: outbox-relay-basket
    restart: unless-stopped
    profiles:
      - full
    depends_on:
      postgresdb:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      - ConnectionStrings__Outbox=Host=postgresdb;Port=5432;Database=Basket;Username=postgres;Password=${POSTGRES_PASSWORD}
      - KafkaProducer__BootstrapServers=broker:9092
      - KafkaProducer__ClientId=outbox-relay-basket-worker
      - KafkaProducer__LingerMs=5
      - OutboxRelay__SchemaName=basket
      - OutboxRelay__TableName=OutboxMessages
      - OutboxRelay__PollingIntervalMs=2000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=BasketOutboxRelay
    ports:
      - "8091:8080"
    deploy:
      resources:
        limits:
          memory: 512M

  outbox-relay-catalog:
    build:
      context: .
      dockerfile: platform/Platform.OutboxRelay.WorkerService/Dockerfile
    container_name: outbox-relay-catalog
    restart: unless-stopped
    profiles:
      - full
    depends_on:
      postgresdb:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      - ConnectionStrings__Outbox=Host=postgresdb;Port=5432;Database=Catalog;Username=postgres;Password=${POSTGRES_PASSWORD}
      - KafkaProducer__BootstrapServers=broker:9092
      - KafkaProducer__ClientId=outbox-relay-catalog-worker
      - KafkaProducer__LingerMs=5
      - OutboxRelay__SchemaName=catalog
      - OutboxRelay__TableName=OutboxMessages
      - OutboxRelay__PollingIntervalMs=2000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=CatalogOutboxRelay
    ports:
      - "8090:8080"
    deploy:
      resources:
        limits:
          memory: 512M

  catalog.api:
    build:
      context: .
      dockerfile: services/Catalog/Catalog.API/Dockerfile
      args:
        # Override the chiseled prod default (no shell, no wget) so the compose-level
        # HEALTHCHECK can shell out to wget. The alpine variant ships busybox (incl.
        # wget) and a shell. Production CI builds without this arg and gets the
        # chiseled image bit-for-bit identical to today.
        BASE_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0.0-alpine3.22
    healthcheck: *readiness-healthcheck
    container_name: catalog.api
    restart: unless-stopped
    profiles:
      - full
    depends_on:
      postgresdb:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-create-topic:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # Map the host's `localhost` to the gateway IP inside the container so
    # JwtBearer.Authority=http://localhost:9011/realms/dotnetatlas (the issuer
    # baked into Keycloak's --hostname per docker-compose.yaml:731) is reachable
    # via the host's port mapping (9011 → keycloak:8080). Avoids the iss/metadata
    # mismatch that would otherwise require overriding MetadataAddress.
    extra_hosts:
      - "localhost:host-gateway"
    environment:
