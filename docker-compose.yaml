  # KEYCLOAK IDENTITY PROVIDER
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    container_name: keycloak9011
    profiles:
      - full
    depends_on:
      postgresdb:
        condition: service_healthy
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname=http://localhost:9011
      - --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresdb:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Local-dev bootstrap admin (admin/admin). In any non-local environment,
      # set KC_BOOTSTRAP_ADMIN_USERNAME/KC_BOOTSTRAP_ADMIN_PASSWORD via a secret
      # store and rotate the first admin immediately after realm import.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./src/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "9011:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data:
  seq_data:
  redis-insight:
  redis-basket-data:
  kafka_data:
  kafka_metadata:
  azurite-data:
