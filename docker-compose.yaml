  # KEYCLOAK IDENTITY PROVIDER
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    container_name: keycloak9011
    profiles:
      - full
    depends_on:
      postgresdb:
        condition: service_healthy
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname=http://localhost:9011
      - --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresdb:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Local-dev bootstrap admin (admin/admin). In any non-local environment,
      # set KC_BOOTSTRAP_ADMIN_USERNAME/KC_BOOTSTRAP_ADMIN_PASSWORD via a secret
      # store and rotate the first admin immediately after realm import.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      # Each resource CLIENT SCOPE in realm-export.json (catalog.read, basket.write, …)
      # carries an `oidc-audience-mapper` that stamps `aud: "<owning-service>"` onto any
      # token requesting that scope (RFC 9068/8707: audience = the resource being called).
      # DO NOT delete those scope mappers — Keycloak's `client_credentials` default emits
      # NO `aud` claim, so without them every BC's `ValidateAudience=true` validator rejects
      # silently. Service clients deliberately have NO per-client audience mapper: a caller's
      # token must be audienced for the CALLEE (from the scope), never for itself.
      # The dev-tooling client `dotnetatlas-swagger` is the one client that stamps audiences
      # client-level, and only where the access path carries no scope (the role-only admin
      # endpoints, the bell hub, the token-exchange holder constraint). Unlike a scope mapper it
      # fires on EVERY token that client issues — keep the set bounded; a consumer-facing client
      # stamps only `bff` + `notifications-service`, never the human-admin `ordering-service` /
      # `invoicing-service` (which would reopen the direct consumer→BC path token exchange closes).
      # See docs/adr/0010-service-to-service-auth.md
      # §"Audience names the callee, not the caller" + src/keycloak/service-scope-matrix.md.
      - ./src/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "9011:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  outbox-relay-saga:
    build:
      context: .
      dockerfile: platform/Platform.OutboxRelay.WorkerService/Dockerfile
      args:
        BASE_IMAGE: *bc-base-image
    healthcheck: *readiness-healthcheck
    container_name: outbox-relay-saga
    restart: unless-stopped
    profiles:
      - full
    depends_on:
      postgresdb:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Outbox=Host=postgresdb;Port=5432;Database=Saga;Username=postgres;Password=${POSTGRES_PASSWORD}
      - KafkaProducer__BootstrapServers=broker:9092
      - KafkaProducer__ClientId=outbox-relay-saga-worker
      - KafkaProducer__LingerMs=5
      - OutboxRelay__PollingIntervalMs=2000
      - OutboxRelay__BatchSize=100
      - OutboxRelay__SchemaName=saga
      - OutboxRelay__TableName=outbox_messages
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=SagaOutboxRelay
    ports:
      - "8089:8080"  # Health checks endpoint
    deploy:
      resources:
        limits:
          memory: 512M

