  # Blob storage + CDN per ADR-0017:
  #   - azurite       : Azure Blob emulator (local origin); devstoreaccount1.
  #   - azurite-init  : one-shot that creates the `invoices` container and attempts the
  #                     10-year immutable-blob policy. Immutability is best-effort in the
  #                     emulator (it lags real Azure Blob); failure is swallowed via `|| true`
  #                     per ADR-0017 autonomous-evolution clause. Production migrates to a
  #                     real storage account where the policy is enforced.
  #   - nginx-cdn     : reverse proxy demonstrating edge-cache semantics (production uses
  #                     Azure Front Door / Azure CDN). Cache: 1g size, 1h inactive (ADR-0017 literal).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.31.0
    container_name: azurite
    restart: unless-stopped
    profiles:
      - core
      - full
    # `--skipApiVersionCheck` accepts newer SDK clients (e.g., `az` CLI's latest API
    # version) that the pinned Azurite 3.31.0 does not natively understand. Without this
    # flag, `azurite-init`'s `az storage container create` call fails with
    # "The API version 2026-02-06 is not supported by Azurite" (emulator-lag — see
    # ADR-0017 autonomous-evolution clause). Production uses real Azure Blob Storage
    # where API version negotiation is always current; this flag is local-only.
    command: [ "azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data", "--debug", "/data/debug.log", "--skipApiVersionCheck" ]
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      # TCP probe — Azurite image is Alpine-based with busybox `nc` supporting `-z`.
      # Must use 127.0.0.1 explicitly: in this image `localhost` resolves IPv6-first
      # (`::1`) but Azurite binds IPv4 only (0.0.0.0), so the IPv6 probe is refused.
      # If the probe ever fails on a future image variant, fallback is `service_started`
      # + a retry loop inside azurite-init (see Risk 1 note from M5 brainstorming).
      test: ["CMD-SHELL", "nc -z -w 1 127.0.0.1 10000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  azurite-init:
    image: mcr.microsoft.com/azure-cli:latest
    container_name: azurite-init
    profiles:
      - core
      - full
    depends_on:
      azurite:
        condition: service_healthy
    environment:
      # Azurite well-known dev account — Microsoft tooling expects this account name + key.
      # Production migration swaps to a real account + managed identity (Aspire automatic).
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    entrypoint: >
      /bin/sh -c "
      az storage container create --name invoices --public-access off;
      az storage container immutability-policy create --container-name invoices --period 3650 --resource-group dev --account-name devstoreaccount1 || true;
      exit 0;
      "
    restart: "no"

  nginx-cdn:
    image: nginx:1.27-alpine
    container_name: nginx-cdn
    restart: unless-stopped
    profiles:
      - full
    depends_on:
      azurite:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./src/nginx-cdn/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          memory: 128M

