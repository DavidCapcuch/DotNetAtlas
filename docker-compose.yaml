# Shared healthcheck for BC API services. Probes the /api/readiness endpoint via
# busybox wget (built into the Alpine -extra base each *.api service pins via
# build.args.BASE_IMAGE; see x-bc-base-image below). Readiness covers host startup
# plus the downstream dependencies (DB / Redis / Kafka) registered with the `ready`
# tag in Platform.ServiceDefaults, giving (healthy) a real signal.
x-readiness-healthcheck: &readiness-healthcheck
  # Use 127.0.0.1 (IP literal) not localhost: catalog/ordering/invoicing.api each
  # have `extra_hosts: "localhost:host-gateway"` (for the Keycloak issuer bridge),
  # which overrides /etc/hosts so `localhost` resolves to the host-gateway IP and
  # the probe never hits in-container loopback. IP literals bypass /etc/hosts.
  test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/readiness"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 45s

# Base image for every BC / service build. Compose pins the Alpine **-extra** variant: busybox
# (shell + wget) for the compose HEALTHCHECK above, plus icu + tzdata so globalization (e.g.
# Notifications quiet-hours IANA zones, ADR-0015) matches the prod chiseled-extra base the
# Dockerfiles bake in. Prod CI builds without this arg → chiseled-extra. One value, one place.
x-bc-base-image: &bc-base-image mcr.microsoft.com/dotnet/aspnet:10.0-alpine3.22-extra@sha256:15dc7dabae548f41dd70e44fb7ffe1790970320fd9facd4d9a6f5e3c072887b8

services:
  postgresdb:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    container_name: postgres5433
    shm_size: 256mb
    restart: always
    profiles:
      - core
      - full
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./src/keycloak/init-db.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
      - ./src/postgres/init-bcs.sql:/docker-entrypoint-initdb.d/15-bcs.sql:ro
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Redis split per ADR-0016:
  #   - redis-basket : authoritative store (Basket aggregate). AOF everysec + noeviction.
  #                    Loss = customer incident; failure mode surfaces as OOM errors, not silent evictions.
  #   - redis-cache  : volatile (BFF L2 FusionCache backplane + ephemeral cache for other services).
  #                    No persistence; 512 MB allkeys-lru eviction; loss = next request pays miss.
  redis-basket:
    image: redis:7.4.11@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    container_name: redis-basket
    restart: always
    profiles:
      - core
      - full
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction" ]
    volumes:
      - redis-basket-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  # Mailpit — dev SMTP sink for the Notifications email channel (ADR-0032). The
  # email dispatcher delivers via MailKit → SMTP 1025; captured mail is browsable
  # on the web UI (8025) and assertable via its REST API in tests.
  mailpit:
    image: axllent/mailpit:v1.31@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    container_name: mailpit
    restart: always
    profiles:
      - core
      - full
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M

  redis-cache:
    image: redis:7.4.11@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    container_name: redis-cache
    restart: always
    profiles:
      - full
    ports:
      - "6380:6379"
    command: [ "redis-server", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru" ]
    # No volume — volatile by design (cache should be empty on restart).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  redis-insight:
    image: redis/redisinsight:2.70@sha256:b7aa18e73329ebb2e3d9e949b8d35193bf5415ef35c16fd9a50e6f832922b296
    restart: always
    profiles:
      - full
    ports:
      - "5540:5540"
    environment:
      - REDISINSIGHT_SKIP_EULA=true
    volumes:
      - redis-insight:/data
    depends_on:
      - redis-basket
    # Auto-connect to redis-basket (authoritative store — the interesting data lives here).
    # Add redis-cache manually via the UI if cache-state inspection is needed.
    command: [ "redis-insight", "--auto-connect", "redis://redis-basket:6379" ]
    deploy:
      resources:
        limits:
          memory: 256M

  seq:
    image: datalust/seq:2025.2@sha256:080ccf44e0593cd4698ba1404b90b4f8bf51ff342e45242f611c91e329554f50
    container_name: seq5341
    profiles:
      - full
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    volumes:
      - seq_data:/data
    deploy:
      resources:
        limits:
          memory: 512M

  jaeger:
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    container_name: jaeger16686ui4317grpc
    profiles:
      - full
    command:
      - "--memory.max-traces=25000"
      - "--query.base-path=/jaeger/ui"
      - "--prometheus.server-url=http://prometheus:9090"
      - "--prometheus.query.normalize-calls=true"
      - "--prometheus.query.normalize-duration=true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317"
    environment:
      - METRICS_STORAGE_TYPE=prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
  
  prometheus:
    image: quay.io/prometheus/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: prometheus9090
    profiles:
      - full
    command:
      - --web.console.templates=/etc/prometheus/consoles
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --storage.tsdb.retention.time=3h
      - --config.file=/etc/prometheus/prometheus-config.yaml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.route-prefix=/
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=otlp-write-receiver
    volumes:
      - ./src/prometheus/prometheus-config.yaml:/etc/prometheus/prometheus-config.yaml
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.4.10@sha256:c132a683b2430fff9115a29b2a79c8ab97540cdcc90846e3c81878c778ca3596
    container_name: grafana3000
    profiles:
      - full
    deploy:
      resources:
        limits:
          memory: 120M
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=http://my.grafana.server/
      - GF_PLUGINS_PREINSTALL=grafana-opensearch-datasource
    volumes:
      - ./src/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./src/grafana/provisioning/:/etc/grafana/provisioning/
    ports:
      - "3000:3000"

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
    container_name: otel-collector
    profiles:
      - full
    deploy:
      resources:
        limits:
          memory: 200M
    restart: unless-stopped
    command: [ "--config=/etc/otelcol-config.yml" ]
    user: 0:0
    volumes:
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./src/otel-collector/otelcol-config.yml:/etc/otelcol-config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      jaeger:
        condition: service_started
    environment:
      - ENVOY_PORT
      - HOST_FILESYSTEM
      - OTEL_COLLECTOR_HOST
      - OTEL_COLLECTOR_PORT_GRPC
      - OTEL_COLLECTOR_PORT_HTTP
      - GOMEMLIMIT=160MiB
  
  kafka:
    image: confluentinc/cp-kafka:7.9.9@sha256:50490d79766dd3a5680e22d4f0257619bb94314fecb01267e8c122214d1928de
    container_name: broker
    restart: unless-stopped
    profiles:
      - full
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      CLUSTER_ID: "EmptNWtoR4GGWx-BH6nGLQ"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_metadata:/var/lib/kafka/metadata
    healthcheck:
      # kafka-topics spins up a full JVM and lists every topic — a real readiness signal, but
      # heavy (~15-20s under host load, e.g. a parallel image build). Generous timeout +
      # start_period stop it from flapping `unhealthy` (which gates dependent BC apps at boot
      # and can wedge an already-running app's Kafka client) while the broker is actually fine.
      test: [ "CMD", "kafka-topics", "--list", "--bootstrap-server", "localhost:9092" ]
      interval: 15s
      timeout: 25s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M

  # Topic taxonomy (full reference: docs/kafka-topology.md):
  #   * Event-log    — retention.ms=-1 (infinite). Downstream BCs replay-rebuild
  #                    from these (catalog.*, ordering.orders, inventory.*-events,
  #                    inventory.reservations, payments.transactions). BACKWARD
  #                    compat per ADR-0007.
  #   * Saga state   — retention.ms=2592000000 (30d). Run-history of in-flight
  #                    sagas (basket.sessions, checkout.sagas). 30d forensic
  #                    window per ADR-0004.
  #   * Command      — retention.ms=604800000 (7d). Transient intent
  #                    (*.*-commands). Unconsumed-after-7d is a runbook event,
  #                    not a replay candidate.
  #   * Audit        — retention.ms=315360000000 (10y). Regulatory retention
  #                    (invoicing.invoices).
  #   * Health probe — defaults, partitions=1 (healthchecks).
  kafka-create-topic:
    container_name: kafka-create-topic
    image: confluentinc/cp-kafka:7.9.9@sha256:50490d79766dd3a5680e22d4f0257619bb94314fecb01267e8c122214d1928de
    profiles:
      - full
    command: >
      bash -c "
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic payments.transactions --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=-1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic healthchecks --partitions 1 --replication-factor 1 --config min.insync.replicas=1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic catalog.products --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=-1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic catalog.categories --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=-1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic basket.sessions --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=2592000000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic ordering.orders --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=-1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic ordering.order-commands --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=604800000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic inventory.stock-events --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=-1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic inventory.reservations --partitions 6 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=-1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic inventory.reservation-commands --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=604800000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic checkout.sagas --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=2592000000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic invoicing.invoices --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=315360000000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic notifications.notify-commands --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=604800000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic notifications.notify-events --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=-1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic payments.payment-commands --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=604800000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic inventory.stock-events.Catalog.DLT --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=1209600000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic inventory.reservation-commands.Inventory.DLT --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=1209600000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic catalog.products.Inventory.DLT --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=1209600000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic ordering.orders.Inventory.DLT --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=1209600000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic ordering.orders.Invoicing.DLT --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=1209600000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic payments.transactions.Invoicing.DLT --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=1209600000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic notifications.notify-commands.Notifications.DLT --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=1209600000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic notifications.notify-events.Invoicing.DLT --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=1209600000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic ordering.order-commands.Ordering.DLT --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=1209600000 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic payments.payment-commands.Payments.DLT --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=1209600000 --if-not-exists
      "
    depends_on:
      kafka:
        condition: service_healthy

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.9@sha256:d81e78cd85674c003784b4beae3baf469ba20131b0abf1d7f21bee67e6d09867
    container_name: schema-registry
    restart: unless-stopped
    profiles:
      - full
    healthcheck:
      test: curl --output /dev/null --silent --head --fail http://schema-registry:8081/subjects
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    deploy:
      resources:
        limits:
          memory: 512M

  # One-shot bootstrap that PUTs Schema Registry compatibility modes per ADR-0007.
  # Global default: FORWARD_TRANSITIVE (conservative for any future subject).
  # Per-subject overrides use Record Name Strategy (Namespace.RecordName); subjects
  # not yet published produce a 40401 from the Registry which we tolerate so the
  # init container can run before any producer warmup.
  schema-registry-init:
    container_name: schema-registry-init
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    profiles:
      - full
    depends_on:
      schema-registry:
        condition: service_healthy
    volumes:
      - ./platform/Platform.SchemaRegistry.Contracts/Avro:/avro:ro
    entrypoint: /bin/sh
    command:
      - -eu
      - -c
      - |
        SR=http://schema-registry:8081
        CT='Content-Type: application/vnd.schemaregistry.v1+json'
        # Global fallback
        curl -fsS -X PUT "$$SR/config" -H "$$CT" -d '{"compatibility":"FORWARD_TRANSITIVE"}'
        # Discover subjects from /avro mount:
        #   subject = {dir-relative-path-with-dots}.{filename-without-ext} (matches RecordNameStrategy)
        #   classification by filename suffix: *Event.avsc → FORWARD_TRANSITIVE, *Command.avsc → FULL_TRANSITIVE
        #   Any .avsc not matching the convention fails the bootstrap loudly (no silent skip).
        find /avro -name '*.avsc' | sort | while read -r f; do
          rel="$${f#/avro/}"
          subject="$$(printf '%s' "$$rel" | sed -e 's|/|.|g' -e 's|\.avsc$$||')"
          case "$$f" in
            *Event.avsc)   mode='FORWARD_TRANSITIVE' ;;
            *Command.avsc) mode='FULL_TRANSITIVE'    ;;
            *)
              echo "ERROR: $$f has no Event/Command suffix — refusing to register"
              exit 1
              ;;
          esac
          curl -fsS -X PUT "$$SR/config/$$subject" -H "$$CT" -d "{\"compatibility\":\"$$mode\"}" \
            || echo "warn: $$subject not yet registered"
        done
        echo "compat bootstrap complete"

  akhq:
    container_name: akhq
    image: tchiotludo/akhq:0.28.0@sha256:c2824dc2ae442b7ec215581f7e60a9f4106ea9004057fa3a1f88a29464cd4e63
    profiles:
      - full
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:8080"
    restart: always
    environment:
      AKHQ_CONFIGURATION: >
        akhq:
          server:
            servlet:
              context-path: /
          security:
            default-group: admin
            enabled: false
          connections:
            local:
              properties:
                bootstrap.servers: "kafka:9092"
              schema-registry:
                url: "http://schema-registry:8081"
    deploy:
      resources:
        limits:
          memory: 512M

  catalog.api:
    build:
      context: .
      dockerfile: services/Catalog/Catalog.Api/Dockerfile
      args:
        BASE_IMAGE: *bc-base-image
    healthcheck: *readiness-healthcheck
    container_name: catalog.api
    restart: unless-stopped
    profiles:
      - full
    depends_on:
      postgresdb:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-create-topic:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # Map the host's `localhost` to the gateway IP inside the container so
    # JwtBearer.Authority=http://localhost:9011/realms/dotnetatlas (the issuer
    # baked into Keycloak's --hostname per docker-compose.yaml:731) is reachable
    # via the host's port mapping (9011 → keycloak:8080). Avoids the iss/metadata
    # mismatch that would otherwise require overriding MetadataAddress.
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Pin the in-container HTTP port. Laptop `dotnet run` instead uses each project's
      # launchSettings port (5100-5106), so every BC can run side by side without all
      # collapsing onto one port. Containers reach each other on 8080; the host sees 810x.
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - ConnectionStrings__Catalog=Host=postgresdb;Port=5432;Database=Catalog;Username=postgres;Password=${POSTGRES_PASSWORD};Include Error Detail=true
