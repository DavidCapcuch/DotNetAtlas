  # Single one-shot Flyway migration container for ALL bounded contexts incl. saga (#269).
  # Runs Flyway sequentially against each per-BC database (created by src/postgres/init-bcs.sql),
  # applying the same idempotent V*.sql files that PostgreSqlTestContainer feeds to Evolve in
  # tests. One container, one image pull, one log stream — dev + test + prod converge on one
  # set of artefacts. Every BC API + outbox-relay + saga gates startup on this service via
  # `condition: service_completed_successfully`.
  #
  # Each BC's SqlScripts dir is mounted under /flyway/sql/<bc> (read-only). The entrypoint
  # loops over the (db,schema) pairs; FLYWAY_PASSWORD is read from the env so it isn't
  # interpolated into the command line. `$$` escapes compose's variable expansion so the
  # shell sees `$db`/`$schema` at run time.
  flyway:
    container_name: flyway
    image: flyway/flyway:11.16-alpine@sha256:1d1ea82034deeaff5c8e7ed603f7719363367e7601d0479e0ed4e92c0479e6d0
    profiles:
      - full
    restart: "no"
    depends_on:
      postgresdb:
        condition: service_healthy
    environment:
      - FLYWAY_USER=postgres
      - FLYWAY_PASSWORD=${POSTGRES_PASSWORD}
      - FLYWAY_BASELINE_ON_MIGRATE=true
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ./services/Catalog/Catalog.Infrastructure/Persistence/Database/Migrations/SqlScripts:/flyway/sql/catalog:ro
      - ./services/Basket/Basket.Infrastructure/Persistence/Database/Migrations/SqlScripts:/flyway/sql/basket:ro
      - ./services/Inventory/Inventory.Infrastructure/Persistence/Database/Migrations/SqlScripts:/flyway/sql/inventory:ro
      - ./services/Ordering/Ordering.Infrastructure/Persistence/Database/Migrations/SqlScripts:/flyway/sql/ordering:ro
      - ./services/Invoicing/Invoicing.Infrastructure/Persistence/Database/Migrations/SqlScripts:/flyway/sql/invoicing:ro
      - ./services/Payments/Payments.Infrastructure/Persistence/Database/Migrations/SqlScripts:/flyway/sql/payments:ro
      - ./services/Notifications/Notifications.Infrastructure/Persistence/Database/Migrations/SqlScripts:/flyway/sql/notifications:ro
      - ./saga/SagaOrchestrators/Common/Persistence/Database/Migrations/SqlScripts:/flyway/sql/saga:ro
    entrypoint:
      - sh
      - -euc
      - |
        for pair in "Catalog catalog" "Basket basket" "Inventory inventory" "Ordering ordering" "Invoicing invoicing" "Payments payments" "Notifications notifications" "Saga saga"; do
          db=$${pair%% *}
          schema=$${pair##* }
          echo "[flyway] applying $$db -> schema $$schema"
          flyway -url=jdbc:postgresql://postgresdb:5432/$$db \
                 -schemas=$$schema \
                 -locations=filesystem:/flyway/sql/$$schema \
                 migrate
        done
        echo "[flyway] all bounded contexts migrated"

