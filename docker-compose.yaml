    extra_hosts:
      - "localhost:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - Bff__Catalog__BaseUrl=http://catalog.api:8080
      - Bff__Inventory__BaseUrl=http://inventory.api:8080
      - ConnectionStrings__Redis__Cache=redis-cache:6379,defaultDatabase=0,allowAdmin=true,connectTimeout=2000,syncTimeout=2000,abortConnect=false
      - Kafka__Brokers__0=broker:9092
      - Kafka__SchemaRegistry__Url=http://schema-registry:8081
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=BFF
    ports:
      - "8108:8080"   # 8100-8107 taken by the BC apis; 8090-8096 by relays; 8080 by nginx-cdn.
    deploy:
      resources:
        limits:
          memory: 512M

