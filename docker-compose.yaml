services:
  postgresdb:
    image: postgres:18.3@sha256:52e6ffd11fddd081ae63880b635b2a61c14008c17fc98cdc7ce5472265516dd0
    container_name: postgres5433
    shm_size: 256mb
    restart: always
    profiles:
      - core
      - full
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./src/keycloak/init-db.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4.6@sha256:d7432711a2a5c99c2e9dd0e006061cd274d7cb7a9e77f07ffe2ea99e21244677
    container_name: redis12346
    restart: always
    profiles:
      - core
      - full
    ports:
      - "12346:6379"
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru" ]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  redis-insight:
    image: redis/redisinsight:2.70@sha256:b7aa18e73329ebb2e3d9e949b8d35193bf5415ef35c16fd9a50e6f832922b296
    restart: always
    profiles:
      - full
    ports:
      - "5540:5540"
    environment:
      - REDISINSIGHT_SKIP_EULA=true
    volumes:
      - redis-insight:/data
    depends_on:
      - redis
    command: [ "redis-insight", "--auto-connect", "redis://redis:6379" ]
    deploy:
      resources:
        limits:
          memory: 256M

  seq:
    image: datalust/seq:2025.2@sha256:080ccf44e0593cd4698ba1404b90b4f8bf51ff342e45242f611c91e329554f50
    container_name: seq5341
    profiles:
      - full
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    volumes:
      - seq_data:/data
    deploy:
      resources:
        limits:
          memory: 512M

  jaeger:
    image: jaegertracing/all-in-one:1.74.0@sha256:c87fc1d9b22766284168abb2ac57ac2160dfc26484e4f965ff2dcc6b849b263a
    container_name: jaeger16686ui4317grpc
    profiles:
      - full
    command:
      - "--memory.max-traces=25000"
      - "--query.base-path=/jaeger/ui"
      - "--prometheus.server-url=http://prometheus:9090"
      - "--prometheus.query.normalize-calls=true"
      - "--prometheus.query.normalize-duration=true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317"
    environment:
      - METRICS_STORAGE_TYPE=prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
  
  prometheus:
    image: quay.io/prometheus/prometheus:v3.6.0@sha256:76947e7ef22f8a698fc638f706685909be425dbe09bd7a2cd7aca849f79b5f64
    container_name: prometheus9090
    profiles:
      - full
    command:
      - --web.console.templates=/etc/prometheus/consoles
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --storage.tsdb.retention.time=3h
      - --config.file=/etc/prometheus/prometheus-config.yaml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.route-prefix=/
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=otlp-write-receiver
    volumes:
      - ./src/prometheus/prometheus-config.yaml:/etc/prometheus/prometheus-config.yaml
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    container_name: grafana3000
    profiles:
      - full
    deploy:
      resources:
        limits:
          memory: 120M
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=http://my.grafana.server/
      - GF_PLUGINS_PREINSTALL=grafana-opensearch-datasource
    volumes:
      - ./src/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./src/grafana/provisioning/:/etc/grafana/provisioning/
    ports:
      - "3000:3000"

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.137.0@sha256:886722fe0f37af9d1fe24d29529253ec59fbf263b3b1df4facaf221373e19d23
    container_name: otel-collector
    profiles:
      - full
    deploy:
      resources:
        limits:
          memory: 200M
    restart: unless-stopped
    command: [ "--config=/etc/otelcol-config.yml" ]
    user: 0:0
    volumes:
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./src/otel-collector/otelcol-config.yml:/etc/otelcol-config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      jaeger:
        condition: service_started
    environment:
      - ENVOY_PORT
      - HOST_FILESYSTEM
      - OTEL_COLLECTOR_HOST
      - OTEL_COLLECTOR_PORT_GRPC
      - OTEL_COLLECTOR_PORT_HTTP
      - GOMEMLIMIT=160MiB
  
  kafka:
    image: confluentinc/cp-kafka:7.5.9
    container_name: broker
    restart: unless-stopped
    profiles:
      - full
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      CLUSTER_ID: "EmptNWtoR4GGWx-BH6nGLQ"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_metadata:/var/lib/kafka/metadata
    healthcheck:
      test: [ "CMD", "kafka-topics", "--list", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M

  kafka-create-topic:
    container_name: kafka-create-topic
    image: confluentinc/cp-kafka:7.5.9
    profiles:
      - full
    command: >
      bash -c "
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic weather.forecast.requests --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic weather.feedbacks --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic weather.alerts --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic notification.commands --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic payments.payment-commands --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic payments.payments --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --if-not-exists &&
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --topic healthchecks --partitions 1 --replication-factor 1 --config min.insync.replicas=1 --if-not-exists
      "
    depends_on:
      kafka:
        condition: service_healthy

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    restart: unless-stopped
    profiles:
      - full
    healthcheck:
      test: curl --output /dev/null --silent --head --fail http://schema-registry:8081/subjects
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8081:8081"
    depends_on:
      - kafka
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    deploy:
      resources:
        limits:
          memory: 512M

  akhq:
    container_name: akhq
    image: tchiotludo/akhq:0.26.0
    profiles:
      - full
    depends_on:
      - kafka
    ports:
      - "9000:8080"
    restart: always
    environment:
      AKHQ_CONFIGURATION: >
        akhq:
          server:
            servlet:
              context-path: /
          security:
            default-group: admin
            enabled: false
          connections:
            local:
              properties:
                bootstrap.servers: "kafka:9092"
              schema-registry:
                url: "http://schema-registry:8081"
    deploy:
      resources:
        limits:
          memory: 512M

  outbox-relay:
    build:
      context: .
      dockerfile: platform/Platform.OutboxRelay.WorkerService/Dockerfile
    container_name: outbox-relay
    restart: unless-stopped
    profiles:
      - full
    depends_on:
      postgresdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      - ConnectionStrings__Outbox=Host=postgresdb;Port=5432;Database=Weather;Username=postgres;Password=${POSTGRES_PASSWORD}
      - KafkaProducer__BootstrapServers=broker:9092
      - KafkaProducer__ClientId=outbox-relay-worker
      - KafkaProducer__LingerMs=5
      - OutboxRelay__SchemaName=weather
      - OutboxRelay__TableName=OutboxMessages
      - OutboxRelay__PollingIntervalMs=2000
      # - ASPNETCORE_ENVIRONMENT=Local
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=WeatherOutboxRelay
    ports:
      - "8088:8080"  # Health checks endpoint
    deploy:
      resources:
        limits:
          memory: 512M

  outbox-relay-saga:
    build:
      context: .
      dockerfile: platform/Platform.OutboxRelay.WorkerService/Dockerfile
    container_name: outbox-relay-saga
    restart: unless-stopped
    profiles:
      - full
    depends_on:
      postgresdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      - ConnectionStrings__Outbox=Host=postgresdb;Port=5432;Database=Weather;Username=postgres;Password=${POSTGRES_PASSWORD}
      - KafkaProducer__BootstrapServers=broker:9092
      - KafkaProducer__ClientId=outbox-relay-saga-worker
      - KafkaProducer__LingerMs=5
      - OutboxRelay__PollingIntervalMs=2000
      - OutboxRelay__BatchSize=100
      - OutboxRelay__SchemaName=saga
      - OutboxRelay__TableName=OutboxMessages
      # - ASPNETCORE_ENVIRONMENT=Local
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=SagaOutboxRelay
    ports:
      - "8089:8080"  # Health checks endpoint
    deploy:
      resources:
        limits:
          memory: 512M

