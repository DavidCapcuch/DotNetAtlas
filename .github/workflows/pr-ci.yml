name: CI (PR)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches-ignore:
      - "**/graphite-base/**"
permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  validate-pr-title:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-conventional-commit-validation.yml

  enforce-format:
    needs: [validate-pr-title]
    permissions:
      contents: write
    uses: ./.github/workflows/pr-enforce-format.yml

  run-ci:
    needs: [enforce-format]
    # No registry, signing, or Pages scopes: PR CI builds images to prove the Dockerfiles still work
    # and publishes nothing — coverage stays in the step summary, and the Pages site deploys only on
    # the release path (main-release-tag.yml). No elevated scope at all: artifact uploads and cache
    # writes authenticate via the runner token, not GITHUB_TOKEN. Granting more here would silently
    # re-arm publishing the moment the callee asked for it.
    permissions:
      contents: read
    uses: ./.github/workflows/main-ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

