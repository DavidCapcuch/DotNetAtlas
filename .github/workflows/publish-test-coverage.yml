name: Reusable - Publish Test Coverage

on:
  workflow_call:
    inputs:
      publish-site:
        description: "Render the HTML report and upload the coverage-site artifact for the Pages deploy. Off by default — only the release path deploys a site."
        type: boolean
        default: false
        required: false

jobs:
  publish-coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Download raw coverage
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: raw-coverage
          path: artifacts/raw-coverage
      - name: Combine Coverage Reports
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: "artifacts/raw-coverage/**/*.cobertura.xml"
          targetdir: "${{ runner.temp }}/coveragereport"
          # Html renders the multi-page site and is only served on the release path; skip the render
          # on PR/main-CI (emitting per-class pages nothing uploads is wasted work). Cobertura,
          # OpenCover, and the Markdown summary are always emitted — SonarCloud reads the OpenCover
          # XML and the run summary reads the Markdown, on every path.
          reporttypes: ${{ inputs.publish-site && 'Cobertura;OpenCover;Html;MarkdownSummaryGithub' || 'Cobertura;OpenCover;MarkdownSummaryGithub' }}
          verbosity: "Info"
          title: "Code Coverage"
          tag: "${{ github.run_number }}_${{ github.run_id }}"
          customSettings: ""
          toolpath: "reportgeneratortool"
      - name: Publish coverage report in build summary
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/coveragereport/SummaryGithub.md" ]; then
            cat "$RUNNER_TEMP/coveragereport/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Upload the WHOLE report dir, not just index.html. The report is multi-page — index.html
      # plus one detail page per class plus shared CSS/JS — so an index-only artifact 404s every
      # drilldown once served (true under HtmlInline too: the dir is the fix, not the type). The
      # type is Html not HtmlInline so those pages share one external css/js rather than inlining
      # assets into every page — leaner for a served site now that the whole dir ships.
      # deploy-coverage-site serves this dir's root, where index.html sits, so the Pages URL
      # resolves. The Cobertura/OpenCover/Markdown siblings ride along unlinked and harmless. Gated
      # on publish-site so PR/main-CI runs — which never deploy a site — don't store a multi-MB
      # artifact nothing downloads.
      - name: Upload Coverage Site artifact (full HTML report)
        if: ${{ inputs.publish-site }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-site
          path: ${{ runner.temp }}/coveragereport
          retention-days: 7
      - name: Upload OpenCover coverage XML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: ${{ runner.temp }}/coveragereport/OpenCover.xml
          retention-days: 30
