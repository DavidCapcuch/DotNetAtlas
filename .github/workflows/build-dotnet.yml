name: Reusable - Build

on:
  workflow_call:
    inputs:
      semVer:
        required: true
        type: string
      assemblySemVer:
        required: true
        type: string
      assemblySemFileVer:
        required: true
        type: string
      informationalVersion:
        required: true
        type: string

jobs:
  build-dotnet:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup .NET SDK (10.0.100)
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5
        with:
          dotnet-version: "10.0.100"
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Show .NET info
        run: dotnet --info
      - name: Restore
        run: dotnet restore --locked-mode
      - name: Build
        env:
          SEMVER: ${{ inputs.semVer }}
          ASSEMBLY_SEMVER: ${{ inputs.assemblySemVer }}
          ASSEMBLY_SEMFILEVER: ${{ inputs.assemblySemFileVer }}
          INFORMATIONAL_VERSION: ${{ inputs.informationalVersion }}
        run: |
          dotnet build \
            --no-restore \
            -c Release \
            -p:TreatWarningsAsErrors=true \
            -p:Version=$SEMVER \
            -p:AssemblyVersion=$ASSEMBLY_SEMVER \
            -p:FileVersion=$ASSEMBLY_SEMFILEVER \
            -p:InformationalVersion=$INFORMATIONAL_VERSION

  # Per-BC `dotnet ef migrations has-pending-model-changes` (#269).
  # Catches uncommitted EF model changes that have not been added as a migration.
  # Matrix axis is per-BC so a single BC failure doesn't mask the rest.
  migrations-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - bc: Catalog
            project: services/Catalog/Catalog.Infrastructure
            startup: services/Catalog/Catalog.Api
          - bc: Basket
            project: services/Basket/Basket.Infrastructure
            startup: services/Basket/Basket.Api
          - bc: Inventory
            project: services/Inventory/Inventory.Infrastructure
            startup: services/Inventory/Inventory.Api
          - bc: Ordering
            project: services/Ordering/Ordering.Infrastructure
            startup: services/Ordering/Ordering.Api
          - bc: Invoicing
            project: services/Invoicing/Invoicing.Infrastructure
            startup: services/Invoicing/Invoicing.Api
          - bc: Payments
            project: services/Payments/Payments.Infrastructure
            startup: services/Payments/Payments.Api
          - bc: Notifications
            project: services/Notifications/Notifications.Infrastructure
            startup: services/Notifications/Notifications.Api
          - bc: Weather
            project: src/Weather.Infrastructure
            startup: src/Weather.Api
          - bc: Saga
            project: saga/SagaOrchestrators
            startup: saga/SagaOrchestrators
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup .NET SDK (10.0.100)
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5
        with:
          dotnet-version: "10.0.100"
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore
        run: dotnet restore --locked-mode
      - name: Restore local .NET tools (.config/dotnet-tools.json)
        run: dotnet tool restore
      - name: Check for pending model changes (${{ matrix.bc }})
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project ${{ matrix.project }} \
            --startup-project ${{ matrix.startup }} \
            --no-build

