name: Reusable - Test with Coverage

on:
  workflow_call:
    inputs:
      configuration:
        required: false
        type: string
        default: Release

jobs:
  test-with-coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup .NET SDK (10.0.100)
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5
        with:
          dotnet-version: "10.0.100"
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore
        run: dotnet restore --locked-mode
      - name: Build (for tests)
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: dotnet build -c "$CONFIGURATION" --no-restore
      # Docker-image caching is intentionally disabled. For this test set (postgres, redis,
      # confluentinc/cp-kafka, cp-schema-registry — all Docker Hub) a save/load round-trip is at
      # best parity with a registry pull: the job is dominated by container startup, not image
      # transfer, and the cache-key input rarely changes. The one real benefit — insulation from
      # Docker Hub rate limits — is better bought with a first-party `docker/login-action` + Hub
      # token than with a single-maintainer fork of an unmaintained action. Re-enable only behind a
      # measurement that shows a real win; if rate limits are the actual problem, add the login.
      # - name: Cache Docker images
      #   uses: AndreKurait/docker-cache@0fe76702a40db986d9663c24954fc14c6a6031b7 #0.6.0
      #   continue-on-error: true
      #   with:
      #     key: docker-${{ runner.os }}-${{ hashFiles('platform/Platform.Test.Framework/**/*Container.cs') }}
      - name: Test with coverage
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          dotnet test \
            --no-build \
            -c "$CONFIGURATION" \
            --settings test/coverlet.runsettings \
            --collect "XPlat Code Coverage" \
            --logger "trx;LogFileName=test_results.trx"
      - name: Upload Test Result Files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: ${{ github.workspace }}/**/TestResults/**/*
          retention-days: 30
      - name: Upload raw coverage XMLs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raw-coverage
          path: ${{ github.workspace }}/**/*.cobertura.xml
          retention-days: 7
