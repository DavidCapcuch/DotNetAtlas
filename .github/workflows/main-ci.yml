name: CI Main pipeline

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

env:
  OTEL_SDK_DISABLED: true

permissions:
  contents: read

jobs:

  determine-version:
    uses: ./.github/workflows/determine-git-version.yml

  build-dotnet:
    needs: [determine-version]
    uses: ./.github/workflows/build-dotnet.yml
    with:
      semVer: ${{ needs.determine-version.outputs.semVer }}
      assemblySemVer: ${{ needs.determine-version.outputs.assemblySemVer }}
      assemblySemFileVer: ${{ needs.determine-version.outputs.assemblySemFileVer }}
      informationalVersion: ${{ needs.determine-version.outputs.informationalVersion }}

  test-with-coverage:
    needs: [build-dotnet]
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/test-with-coverage.yml
    with:
      configuration: Release

  publish-coverage:
    needs: [test-with-coverage]
    uses: ./.github/workflows/publish-test-coverage.yml

  push-coverage-site:
    needs: [publish-coverage]
    permissions:
      contents: write
      pages: write
    uses: ./.github/workflows/publish-coverage-site.yml

  sonar-cloud:
    needs: [publish-coverage]
    uses: ./.github/workflows/sonar-cloud-analysis.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Build-only: proves every Dockerfile still builds before merge, and publishes nothing.
  # Publishing is `main-release-tag.yml`'s job — it is the workflow that owns a release.
  # The `contents: read` grant below is what ENFORCES that, not just documents it: a called
  # workflow can only downgrade the caller's token, so the build cannot reach GHCR even if a
  # future edit to the callee asks it to.
  docker-image-build:
    needs: [determine-version, test-with-coverage]
    permissions:
      contents: read
    uses: ./.github/workflows/docker-image-build-push-sign.yml
    with:
      semVer: ${{ needs.determine-version.outputs.semVer }}
      assemblySemVer: ${{ needs.determine-version.outputs.assemblySemVer }}
      assemblySemFileVer: ${{ needs.determine-version.outputs.assemblySemFileVer }}
      informationalVersion: ${{ needs.determine-version.outputs.informationalVersion }}
